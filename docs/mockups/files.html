<style>
body{margin:0;background:#000}
.ph{width:390px;height:844px;box-sizing:border-box;padding:6px;background:#000;display:flex;flex-direction:column;font-family:'Antonio','Arial Narrow','Liberation Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em;color:#FF9900}
.top{display:flex;height:54px;flex:none}
.elbow{position:relative;flex:1;background:#FF9900;border-top-left-radius:44px}
.elbow i{position:absolute;left:96px;top:26px;right:0;bottom:0;background:#000;border-top-left-radius:20px}
.title{height:30px;display:flex;align-items:center;padding:0 8px;font-size:28px;font-weight:700;color:#FF9900;line-height:1;white-space:nowrap}
.cap{width:22px;height:26px;background:#FF9900;border-radius:0 999px 999px 0;flex:none}
.mid{flex:1;display:flex;min-height:0}

.content{flex:1;min-width:0;padding:4px 0 0 10px;overflow:hidden;position:relative}
.bot{display:flex;align-items:flex-end;height:39px;flex:none}

.belbow i{position:absolute;left:96px;top:0;right:0;bottom:18px;background:#000;border-bottom-left-radius:20px}
.foot{height:18px;display:flex;align-items:center;padding:0 8px;font-size:13px;color:#FF9900;white-space:nowrap}
.bcap{width:22px;height:18px;background:#FF9900;border-radius:0 999px 999px 0;flex:none}
.sh{display:flex;align-items:center;gap:6px;margin:14px 0 8px}
.sh .l{width:16px;height:20px;border-radius:999px 0 0 999px;flex:none}
.sh .t{font-size:18px;font-weight:700;white-space:nowrap}
.sh .r{flex:1;height:10px;border-radius:0 999px 999px 0}
.ro{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.ro .k{color:#99CCFF;font-size:15px}
.ro .v{font-size:18px;text-align:right;white-space:nowrap}
.btn{height:44px;min-width:72px;box-sizing:border-box;padding:0 14px;border:0;border-radius:999px;display:inline-flex;align-items:center;justify-content:flex-end;color:#000;font-family:inherit;font-size:15px;text-transform:uppercase;letter-spacing:inherit;text-decoration:none}
.btn.off{background:#4A3320!important;color:#8a8a8a}
.chip{height:34px;box-sizing:border-box;padding:0 12px;border-radius:999px;border:2px solid #FFCC66;background:#000;color:#FFCC66;font-family:inherit;font-size:14px;text-transform:uppercase;letter-spacing:inherit;display:inline-flex;align-items:center}
.chip.on{background:#FFCC66;color:#000}
.prog{display:flex;gap:3px;height:16px}
.prog b{flex:1;background:#4A3320}
.prog b.on{background:#FFCC66}
.row{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:13px;color:#9a8a7a;text-transform:none;letter-spacing:.01em;font-family:'Antonio','Arial Narrow','Liberation Sans Narrow',sans-serif}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.field label{font-size:13px;color:#99CCFF}
.field input{height:46px;box-sizing:border-box;border:2px solid #FF9900;border-radius:8px;background:#000;color:#FF9900;font-family:inherit;font-size:18px;padding:0 10px;letter-spacing:.02em}
.ph-img{background:#0d0d0d;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#8a8a8a;font-size:13px}

html,body{background:#000}
</style>
