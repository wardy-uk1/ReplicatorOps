name: CuraEngine probe
on:
  push:
    branches: [curaengine-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CuraEngine for Android
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          sudo apt-get install -y ninja-build >/dev/null
          native/curaengine/build.sh android "$ANDROID_NDK_LATEST_HOME"
          file native/curaengine/work/out-android/CuraEngine
