name: Build APK

on:
  push:
    branches: [main, beta]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # main builds the normal app; the beta branch builds "Replicator Ops Beta" (with the
      # on-phone slicer) and publishes it as a GitHub pre-release.
      - name: Read app version
        id: ver
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"; echo "flavor=Beta" >> "$GITHUB_OUTPUT"; echo "branch=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"; echo "flavor=Stable" >> "$GITHUB_OUTPUT"; echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      # ---- Beta: build the Kiri:Moto slicing engine (MIT) into the app's assets ----------
      - name: Set up Node (beta)
        if: steps.ver.outputs.channel == 'beta'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Kiri:Moto (beta)
        if: steps.ver.outputs.channel == 'beta'
        uses: actions/checkout@v4
        with:
          repository: GridSpace/grid-apps
          ref: d138275bbe9d4e4030d8cb8b2dcf66607da9295a
          path: grid-apps

      - name: Build Kiri:Moto engine (beta)
        if: steps.ver.outputs.channel == 'beta'
        working-directory: grid-apps
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx webpack --config bin/webpack-three-esm.js
          npx webpack --config bin/webpack-jszip-esm.js
          node bin/esbuild.config.mjs prod
          dest=../app/src/beta/assets
          mkdir -p $dest/kiri $dest/wasm $dest/licenses
          cp src/pack/kiri-eng.js src/pack/kiri-work.js src/pack/kiri-pool.js $dest/kiri/
          cp src/wasm/*.wasm $dest/wasm/
          cp license.md $dest/licenses/Kiri-Moto-LICENSE.md
          ls -la $dest/kiri $dest/wasm

      # Slice a 20 mm cube with the app's own Q2C settings in headless Chrome, so a broken
      # engine build never ships.
      - name: Slicer self-test (beta)
        if: steps.ver.outputs.channel == 'beta'
        run: |
          chmod +x gradlew
          ./gradlew testBetaDebugUnitTest --tests '*SliceSettingsTest*' --console=plain
          cp app/build/selftest.json app/src/beta/assets/slicer/selftest.json
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm install --no-audit --no-fund puppeteer-core@23 >/dev/null
          node "$GITHUB_WORKSPACE/.github/scripts/slicer-selftest.mjs" "$GITHUB_WORKSPACE/app/src/beta/assets"
          rm "$GITHUB_WORKSPACE/app/src/beta/assets/slicer/selftest.json"

      # A new versionName on main publishes a release (once per version).
      - name: Is this a new release?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || { [ "${{ github.ref }}" != "refs/heads/main" ] && [ "${{ github.ref }}" != "refs/heads/beta" ]; }; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Stamp today's stardate (yyyyDD.MM, UTC) on this version's Captain's Log entry,
      # before the build, so the app, the release notes and the repo all show the release date.
      - name: Stamp stardate
        id: stardate
        if: steps.rel.outputs.release == 'true'
        run: |
          v="${{ steps.ver.outputs.version }}"
          sd=$(date -u +%Y%d.%m)
          f=app/src/main/assets/CHANGELOG.md
          ve=$(printf '%s' "$v" | sed 's/[.]/\\./g')
          if ! grep -qE "^## v?${ve}( |$)" "$f"; then
            echo "::error::No Captain's Log entry for $v in $f. Add '## $v' with '- ' bullets before releasing."
            exit 1
          fi
          sed -i -E "s/^## v?${ve}( .*)?$/## ${v} · Stardate ${sd}/" "$f"
          grep -E "^## ${ve} " "$f"
          echo "stardate=$sd" >> "$GITHUB_OUTPUT"

      # The fixed signing key comes from repo secrets so every build can update the last one.
      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/replicatorops.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/replicatorops.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 secret not set: building with a throwaway key and skipping the release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew test${{ steps.ver.outputs.flavor }}DebugUnitTest assemble${{ steps.ver.outputs.flavor }}Release --console=plain

      - name: Name the APK
        id: apk
        run: |
          c=${{ steps.ver.outputs.channel }}
          if [ "$c" = beta ]; then name="ReplicatorOps-Beta-${{ steps.ver.outputs.version }}.apk"; else name="ReplicatorOps-${{ steps.ver.outputs.version }}.apk"; fi
          src=app/build/outputs/apk/$c/release/app-$c-release.apk
          [ -f "$src" ] || src=app/build/outputs/apk/$c/release/app-$c-release-unsigned.apk
          cp "$src" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      # Release notes come from the Captain's Log (the same entry the app shows).
      - name: Release notes from Captain's Log
        if: steps.rel.outputs.release == 'true' && steps.sign.outputs.signed == 'true'
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk -v v="$v" -v q="'" '
            /^## / { if (found) exit; if ($2 == v || $2 == "v" v) { found = 1; print "### Captain" q "s Log · " substr($0, 4); print ""; next } }
            found && /^[-*] / { print }
          ' app/src/main/assets/CHANGELOG.md > release-notes.md
          if [ "${{ steps.ver.outputs.channel }}" = beta ]; then
            printf '\n---\n**Beta:** installs as a separate app, "Replicator Ops Beta", next to the normal one. Update it from inside the Beta with Starbase Uplink.\n' >> release-notes.md
          else
            printf '\n---\nInstall the APK below, or update from inside the app with Starbase Uplink.\n' >> release-notes.md
          fi
          cat release-notes.md

      - name: Publish release
        if: steps.rel.outputs.release == 'true' && steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Replicator Ops ${{ steps.ver.outputs.channel == 'beta' && 'Beta ' || '' }}${{ steps.ver.outputs.version }}
          files: ${{ steps.apk.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ steps.ver.outputs.channel == 'beta' }}
          make_latest: ${{ steps.ver.outputs.channel == 'beta' && 'false' || 'true' }}

      # Save the stamped stardate back to the repo so later builds keep it.
      - name: Save stardate to the repo
        if: steps.rel.outputs.release == 'true' && steps.sign.outputs.signed == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Captain's Log: stardate ${{ steps.stardate.outputs.stardate }} for ${{ steps.ver.outputs.version }}"
          git push origin HEAD:${{ steps.ver.outputs.branch }}
